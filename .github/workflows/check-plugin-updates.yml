name: Check plugin updates

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 09:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run update check
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/check-plugin-updates.sh | tee updates.txt && echo "outdated=false" >> "$GITHUB_OUTPUT" || echo "outdated=true" >> "$GITHUB_OUTPUT"

      - name: Open or update issue
        if: steps.check.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="$(cat updates.txt)"
          existing=$(gh issue list --state open --json number,title \
            --jq '.[] | select(.title == "chore: Claude plugin updates available") | .number' | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "chore: Claude plugin updates available" \
              --body "$body"
          fi
